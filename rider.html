<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041219"><meta name="robots" content="noindex,nofollow">
<title>DoorStep Rider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout (Variant B): phone column with bottom nav and a raised centre cart button; Admin gets a left sidebar on desktop.
   Look: deep navy-teal with turquoise to sky gradient, green discount chips. White mode is a pale aqua with deeper teal. */
:root{
  --bg:#041219;--s1:#08232E;--s2:#0C3140;--line:#124556;
  --tx:#EAF8FB;--mut:#8CB3BE;--ac:#14E0D0;--ac2:#2BB8FF;--on-ac:#02171C;
  --grad:linear-gradient(120deg,#14E0D0 0%,#2BB8FF 100%);
  --gold:#F5C86A;--dng:#FF6B7A;--wrn:#FFB224;--gn:#33DB78;--gnb:rgba(51,219,120,.16);
  --glow:0 0 26px rgba(20,224,208,.3);--shadow:0 12px 32px rgba(0,0,0,.45);
  --nav:rgba(4,18,25,.95);--hero:linear-gradient(135deg,#0B4B58 0%,#07313B 55%,#0A3C5C 100%);
  --bgfx:radial-gradient(700px 420px at 50% -80px,rgba(20,224,208,.14),transparent 70%);
  --gfx:drop-shadow(0 0 10px rgba(20,224,208,.45));--ovl:rgba(0,0,0,.66);
  --f-d:'Sora','Plus Jakarta Sans',system-ui,sans-serif;
  --f-b:'Plus Jakarta Sans','Hind',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EFF9FB;--s1:#FFFFFF;--s2:#E1F2F5;--line:#C7E3E9;
  --tx:#072A33;--mut:#3F6B76;--ac:#0A7F8C;--ac2:#0A6FB0;--on-ac:#FFFFFF;
  --grad:linear-gradient(120deg,#0A7F8C 0%,#0A6FB0 100%);
  --gold:#8A5C00;--dng:#C23547;--wrn:#A85F00;--gn:#13783A;--gnb:rgba(19,120,58,.12);
  --glow:0 8px 22px rgba(10,127,140,.25);--shadow:0 8px 24px rgba(7,60,70,.10);
  --nav:rgba(239,249,251,.95);--hero:linear-gradient(135deg,#D7F1F3 0%,#E3F4F6 55%,#DCEBFA 100%);
  --bgfx:radial-gradient(700px 420px at 50% -80px,rgba(10,111,176,.10),transparent 70%);
  --gfx:none;--ovl:rgba(5,30,36,.5);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EFF9FB;--s1:#FFFFFF;--s2:#E1F2F5;--line:#C7E3E9;
  --tx:#072A33;--mut:#3F6B76;--ac:#0A7F8C;--ac2:#0A6FB0;--on-ac:#FFFFFF;
  --grad:linear-gradient(120deg,#0A7F8C 0%,#0A6FB0 100%);
  --gold:#8A5C00;--dng:#C23547;--wrn:#A85F00;--gn:#13783A;--gnb:rgba(19,120,58,.12);
  --glow:0 8px 22px rgba(10,127,140,.25);--shadow:0 8px 24px rgba(7,60,70,.10);
  --nav:rgba(239,249,251,.95);--hero:linear-gradient(135deg,#D7F1F3 0%,#E3F4F6 55%,#DCEBFA 100%);
  --bgfx:radial-gradient(700px 420px at 50% -80px,rgba(10,111,176,.10),transparent 70%);
  --gfx:none;--ovl:rgba(5,30,36,.5);color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
html.lock,html.lock body{overflow:hidden}
body{background-color:var(--bg);background-image:var(--bgfx);background-repeat:no-repeat;color:var(--tx);
  font-family:var(--f-b);font-size:14.5px;line-height:1.4;padding-block:0 170px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--tx)}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
h1,h2,h3,h4{margin:0}
.ic{flex:none;display:block}
.shell{width:100%;max-width:480px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell.wide{max-width:1100px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut)}
.tn{font-variant-numeric:tabular-nums}
.d{font-family:var(--f-d)}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:var(--gfx)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;min-width:0}
.card.sh{box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sec-h h2{font-family:var(--f-d);font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.link{color:var(--ac);font-weight:700;font-size:13px;white-space:nowrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}

/* top strip + header */
.strip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.live{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--ac);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{padding:7px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap;position:relative}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--on-ac);box-shadow:var(--glow)}
.nb{position:absolute;right:-2px;top:-4px;min-width:17px;height:17px;border-radius:99px;background:var(--dng);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr .shell{display:flex;align-items:center;gap:10px;padding-block:9px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:var(--on-ac);box-shadow:var(--glow);flex:none}
.brand{font-family:var(--f-d);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:6px}
.brand i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:6px;border:1px solid var(--ac);color:var(--ac)}
.by{font-size:12px;font-weight:700;margin-top:1px}
.tsw{width:58px;height:32px;border-radius:99px;background:var(--s1);border:1px solid var(--line);position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:var(--mut)}
.tsw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--grad);box-shadow:var(--glow);transition:transform .25s}
.tsw[aria-checked="true"]::after{transform:translateX(26px)}
.tsw .ic{position:relative;z-index:1}
.tsw .sunI{color:var(--mut)}.tsw .moonI{color:var(--on-ac)}
.tsw[aria-checked="false"] .sunI{color:var(--on-ac)}.tsw[aria-checked="false"] .moonI{color:var(--mut)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--ac);font-weight:800;flex:none;position:relative}
.avatar::after{content:"";position:absolute;right:-1px;top:-1px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}

/* location + search */
.loc{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:12px}
.loc .t{font-size:13px;font-weight:600}
.loc small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:700}
.chipx{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);font-size:11.5px;font-weight:800;white-space:nowrap;background:transparent}
.search{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 14px;margin-top:12px;color:var(--mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:9px 0;font-size:14.5px}
.search input::placeholder{color:var(--mut)}
.mic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ac);flex:none}
.mic.on{background:var(--dng);color:#fff;animation:ping 1.2s infinite}
.save{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--hero);border-color:var(--line);width:100%;text-align:left}
.save .ico{width:34px;height:34px;border-radius:50%;background:var(--grad);color:var(--on-ac);display:grid;place-items:center;flex:none}
.save b.v{font-family:var(--f-d);font-size:18px}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.hs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;min-height:176px;position:relative;display:flex;align-items:center;gap:8px;padding:18px 16px 30px;background:var(--hero);background-size:cover;background-position:center;text-align:left;width:100%}
.sl.img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,16,14,.82),rgba(2,16,14,.25))}
.sl>*{position:relative}
.sl .tg{display:inline-flex;font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);background:rgba(0,0,0,.18)}
.sl.img .tg{color:#7dffd8;border-color:#7dffd8}
.sl h3{font-family:var(--f-d);font-size:21px;font-weight:800;line-height:1.15;margin:9px 0 5px;letter-spacing:-.02em}
.sl.img h3,.sl.img p{color:#fff}
.sl p{margin:0;font-size:12.5px;color:var(--mut);max-width:20em}
.sl .pic{flex:0 0 38%;max-width:150px;aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.3);transform:rotate(3deg)}
.sl .pic img{width:100%;height:100%;object-fit:cover}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--mut);opacity:.55;transition:all .25s}
.dots i.on{width:22px;background:var(--ac);opacity:1}
.hnav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.hnav.l{left:8px}.hnav.r{right:8px}

/* delivery progress */
.fd{padding:11px 14px;display:flex;flex-direction:column;gap:8px}
.fd .t{font-weight:700;font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .4s}
.fd.done{border-color:var(--ac)}
.fd.warn{border-color:var(--wrn)}

/* products */
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 8px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.rail .pc{flex:0 0 138px;scroll-snap-align:start}
.rail.flash .pc{flex-basis:152px;border-color:var(--wrn)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;min-width:0;cursor:pointer}
.pimg{position:relative;aspect-ratio:1;background:var(--s2)}
.pimg img{width:100%;height:100%;object-fit:cover}
.db{position:absolute;left:0;top:0;background:var(--wrn);color:#1a1000;font-size:10px;font-weight:800;padding:3px 7px;border-radius:0 0 10px 0}
.pc .ctl{position:absolute;right:6px;bottom:6px}
.pb{padding:8px 9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pnm{font-weight:700;font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pun{font-size:11px;color:var(--mut)}
.ppr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.ppr b{font-family:var(--f-d);font-size:14.5px}
.ppr s{color:var(--mut);font-size:11px}
.low{font-size:10.5px;font-weight:800;color:var(--wrn)}
.addb{display:inline-flex;align-items:center;gap:3px;background:var(--s1);color:var(--ac);border:1.5px solid var(--ac);border-radius:10px;padding:5px 12px;font-weight:800;font-size:12px;letter-spacing:.04em;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.addb.big{padding:12px 22px;font-size:14px;border-radius:14px}
.stp{display:inline-flex;align-items:center;background:var(--grad);color:var(--on-ac);border-radius:10px;font-weight:800;box-shadow:var(--glow);animation:pop .22s}
.stp button{width:28px;height:30px;display:grid;place-items:center}
.stp span{min-width:20px;text-align:center;font-size:13px}
.stp.big button{width:40px;height:44px}.stp.big span{font-size:16px;min-width:30px}.stp.big{border-radius:14px}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.oos{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--s2);color:var(--mut)}

/* categories */
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ct{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.ct .tile{width:100%;aspect-ratio:1;border-radius:18px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;font-size:30px;overflow:hidden;position:relative}
.ct .tile img{width:100%;height:100%;object-fit:cover}
.ct b{font-size:11.5px;line-height:1.2;font-weight:700}
.ct small{font-size:10.5px;color:var(--mut);margin-top:-4px}
.catpg{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;margin-top:12px}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(70px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 150px);overflow-y:auto;scrollbar-width:none}
.side button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;border:1px solid transparent;font-size:10.5px;font-weight:700;text-align:center;line-height:1.15;color:var(--mut)}
.side .tile{width:46px;height:46px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;font-size:23px;overflow:hidden}
.side .tile img{width:100%;height:100%;object-fit:cover}
.side button[aria-pressed="true"]{color:var(--tx);border-color:var(--ac);background:var(--s1)}
.side button[aria-pressed="true"] .tile{border-color:var(--ac);box-shadow:var(--glow)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--grad);color:var(--on-ac);border-color:transparent}
.empty{padding:26px 16px;text-align:center;color:var(--mut)}

/* whatsapp */
.wa{display:flex;align-items:center;gap:12px;padding:13px;border-radius:18px;background:linear-gradient(120deg,#0b7a52,#12a672);color:#fff}
.wa .ic2{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.2);display:grid;place-items:center;flex:none}
.wa h3{font-family:var(--f-d);font-size:15px}
.wa p{margin:0;font-size:12px;opacity:.9}
.wa a{background:#04120c;color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.05em;border-radius:99px;padding:9px 12px;text-decoration:none;white-space:nowrap}

/* nav + cart bar */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .shell{display:grid;grid-template-columns:repeat(4,1fr);padding-block:6px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--mut);position:relative}
.bnav button[aria-pressed="true"]{color:var(--ac)}
.bnav button[aria-pressed="true"]::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--grad);box-shadow:var(--glow)}
.bnav .nb{right:calc(50% - 22px);top:0}
.cartbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:34;pointer-events:none}
.cartbar .cb{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 9px 9px 16px;border-radius:18px;background:var(--grad);color:var(--on-ac);box-shadow:var(--glow),0 10px 26px rgba(0,0,0,.35)}
.cartbar.bump .cb{animation:pop .3s}
.cartbar .tx{flex:1;min-width:0;font-weight:800;font-size:13.5px;line-height:1.2}
.cartbar .tx small{display:block;font-weight:700;font-size:11.5px;opacity:.85}
.cartbar .vb{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.2);white-space:nowrap}

/* full pages + sheets */
.page{position:fixed;inset:0;z-index:60;background-color:var(--bg);background-image:var(--bgfx);background-repeat:no-repeat;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.page .pgh{position:sticky;top:0;z-index:5;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.page .pgh .shell{display:flex;align-items:center;gap:10px;padding-block:10px}
.pgh h2{font-family:var(--f-d);font-size:17px;font-weight:700}
.pgb{padding-block:14px 24px;flex:1}
.pgf{position:sticky;bottom:0;z-index:5;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.pgf .shell{padding-block:10px}
.ib{width:38px;height:38px;border-radius:50%;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ov{position:fixed;inset:0;z-index:70;background:var(--ovl);display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:16px}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.ov.mid .sheet{border-radius:24px;max-height:94%}
.sheet.wide{max-width:640px}
.sheet h3{font-family:var(--f-d);font-size:18px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.field input,.field select,.field textarea{background:var(--s1);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;width:100%}
.field textarea{resize:vertical;min-height:64px}
.field input.err{border-color:var(--dng);box-shadow:0 0 0 3px rgba(255,107,122,.2)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

function noiseBuf(a,sec){const n=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b}
function irBuf(a,sec,dec){const n=Math.floor(a.sampleRate*sec),b=a.createBuffer(2,n,a.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}return b}
function bell(a,dest,f,t,len,vol){
 const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),g2=a.createGain();
 o.type='sine';o.frequency.setValueAtTime(f*.97,t);o.frequency.exponentialRampToValueAtTime(f,t+.025);
 o2.type='sine';o2.frequency.value=f*2.76;g2.gain.value=.22;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+len);
 o.connect(g);o2.connect(g2);g2.connect(g);g.connect(dest);o.start(t);o2.start(t);o.stop(t+len+.05);o2.stop(t+len+.05);
}
function sndAdd(){const a=ac();if(!a)return;const t=a.currentTime,m=a.createGain();m.gain.value=.55;m.connect(a.destination);
 bell(a,m,880,t,.28,.55);bell(a,m,1318.5,t+.075,.4,.5);vib(10)}
function sndDec(){const a=ac();if(!a)return;const t=a.currentTime,m=a.createGain();m.gain.value=.45;m.connect(a.destination);bell(a,m,523.25,t,.2,.5);bell(a,m,392,t+.06,.26,.4)}
function sndChime(){const a=ac();if(!a)return;const t=a.currentTime,m=a.createGain();m.gain.value=.5;m.connect(a.destination);
 [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>bell(a,m,f,t+i*.09,.7,.5));vib([20,30,20])}
function sndBell(){const a=ac();if(!a)return;const t=a.currentTime,m=a.createGain();m.gain.value=.55;m.connect(a.destination);
 for(let i=0;i<3;i++){bell(a,m,987.77,t+i*.32,.5,.6);bell(a,m,1318.5,t+i*.32+.1,.5,.5)}}
function thunder(){
 const a=ac();if(!a)return;const t=a.currentTime;
 const out=a.createGain();out.gain.value=.9;const comp=a.createDynamicsCompressor();out.connect(comp);comp.connect(a.destination);
 const rv=a.createConvolver();rv.buffer=irBuf(a,3.4,2.2);const rg=a.createGain();rg.gain.value=.8;rv.connect(rg);rg.connect(comp);
 const nb=noiseBuf(a,5);
 /* 1. electric zap */
 const z=a.createOscillator(),zg=a.createGain(),zf=a.createBiquadFilter();
 z.type='sawtooth';z.frequency.setValueAtTime(4800,t);z.frequency.exponentialRampToValueAtTime(120,t+.24);
 zf.type='bandpass';zf.frequency.value=2000;zf.Q.value=.9;
 zg.gain.setValueAtTime(.0001,t);zg.gain.exponentialRampToValueAtTime(.55,t+.01);zg.gain.exponentialRampToValueAtTime(.001,t+.28);
 z.connect(zf);zf.connect(zg);zg.connect(out);z.start(t);z.stop(t+.3);
 /* 2. sharp crack */
 const c=a.createBufferSource();c.buffer=nb;const ch=a.createBiquadFilter();ch.type='highpass';ch.frequency.value=1100;
 const cg=a.createGain();cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(1.7,t+.003);cg.gain.exponentialRampToValueAtTime(.001,t+.4);
 c.connect(ch);ch.connect(cg);cg.connect(out);cg.connect(rv);c.start(t);c.stop(t+.45);
 /* 3. rolling boom, low-pass sweeping down, with pulses */
 const r=a.createBufferSource();r.buffer=nb;const rl=a.createBiquadFilter();rl.type='lowpass';rl.Q.value=.9;
 rl.frequency.setValueAtTime(2600,t+.08);rl.frequency.exponentialRampToValueAtTime(80,t+3.8);
 const g3=a.createGain();g3.gain.setValueAtTime(0,t+.08);g3.gain.linearRampToValueAtTime(1.9,t+.22);
 g3.gain.linearRampToValueAtTime(.7,t+.6);g3.gain.linearRampToValueAtTime(1.4,t+.95);g3.gain.linearRampToValueAtTime(.5,t+1.5);
 g3.gain.linearRampToValueAtTime(.95,t+1.95);g3.gain.exponentialRampToValueAtTime(.001,t+4);
 r.connect(rl);rl.connect(g3);g3.connect(out);g3.connect(rv);r.start(t+.08);r.stop(t+4.2);
 /* 4. second crack */
 const n3=a.createBufferSource();n3.buffer=nb;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=800;bp.Q.value=.6;
 const g4=a.createGain();g4.gain.setValueAtTime(0,t+.7);g4.gain.linearRampToValueAtTime(.8,t+.705);g4.gain.exponentialRampToValueAtTime(.001,t+1.3);
 n3.connect(bp);bp.connect(g4);g4.connect(out);g4.connect(rv);n3.start(t+.7);n3.stop(t+1.4);
 /* 5. sub-bass */
 [66,44].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';
  o.frequency.setValueAtTime(f,t+.1);o.frequency.exponentialRampToValueAtTime(f*.5,t+3);
  g.gain.setValueAtTime(0,t+.1);g.gain.linearRampToValueAtTime(i?.55:.9,t+.4);g.gain.exponentialRampToValueAtTime(.001,t+3.3);
  o.connect(g);g.connect(out);o.start(t+.1);o.stop(t+3.4)});
 vib([40,30,120,40,60]);
}

/* ================= CANVAS FX ================= */
const cv=$('fx'),cx=cv.getContext('2d');
let raf=0,parts=[],bolts=[],rings=[],flashA=0,endAt=0;
function fit(){const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.floor(innerWidth*d);cv.height=Math.floor(innerHeight*d);cx.setTransform(d,0,0,d,0,0)}
function addBolt(x,y,ang,len,depth){
 const pts=[[x,y]];let px=x,py=y,a=ang;const n=Math.max(6,Math.floor(len/16));
 for(let i=0;i<n;i++){a+=(Math.random()-.5)*.95;px+=Math.cos(a)*len/n;py+=Math.sin(a)*len/n;pts.push([px,py]);
  if(depth<2&&Math.random()<.2)addBolt(px,py,a+(Math.random()-.5)*1.7,len*.42,depth+1)}
 bolts.push({pts,born:performance.now()+depth*40,life:650+Math.random()*350,w:depth?1.4:3.2});
}
function addConfetti(x,y,n,burst){
 const cols=['#14E0D0','#2BB8FF','#F5C86A','#FFB224','#ffffff','#ff6b7a'];
 for(let i=0;i<n;i++){const a=burst?Math.random()*Math.PI*2:(-Math.PI/2+(Math.random()-.5)*1.8);const sp=burst?(3+Math.random()*9):(4+Math.random()*8);
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*6.3,vr:(Math.random()-.5)*.4,w:5+Math.random()*6,h:3+Math.random()*4,c:cols[i%cols.length],born:performance.now()})}
}
function loop(now){
 cx.clearRect(0,0,innerWidth,innerHeight);
 if(flashA>0){cx.fillStyle='rgba(225,247,255,'+flashA+')';cx.fillRect(0,0,innerWidth,innerHeight);flashA=Math.max(0,flashA-.03)}
 rings.forEach(r=>{const k=(now-r.born)/r.life;if(k<0||k>1)return;cx.beginPath();cx.arc(r.x,r.y,k*r.max,0,6.283);cx.lineWidth=r.w*(1-k)+1;cx.strokeStyle='rgba(43,184,255,'+(1-k)+')';cx.shadowColor='#2BB8FF';cx.shadowBlur=22;cx.stroke();cx.shadowBlur=0});
 bolts.forEach(b=>{const k=(now-b.born)/b.life;if(k<0||k>1)return;const al=k<.15?1:(1-k);
  cx.beginPath();b.pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.lineJoin='round';
  cx.strokeStyle='rgba(170,235,255,'+al+')';cx.lineWidth=b.w*(.6+al*.6);cx.shadowColor='#2BB8FF';cx.shadowBlur=16;cx.stroke();
  cx.strokeStyle='rgba(255,255,255,'+al+')';cx.lineWidth=b.w*.4;cx.shadowBlur=0;cx.stroke()});
 parts.forEach(p=>{p.vy+=.22;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;const k=(now-p.born)/2600;if(k>1)return;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=1-k*k;cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
 if(now<endAt)raf=requestAnimationFrame(loop);else{cx.clearRect(0,0,innerWidth,innerHeight);raf=0;parts=[];bolts=[];rings=[]}
}
function fxStart(ms){fit();endAt=Math.max(endAt,performance.now()+ms);if(!raf)raf=requestAnimationFrame(loop)}
function confetti(){if(rm)return;addConfetti(innerWidth*.2,innerHeight*.4,60,false);addConfetti(innerWidth*.8,innerHeight*.4,60,false);fxStart(3000)}
function shock(x,y){
 if(rm)return;x=x==null?innerWidth/2:x;y=y==null?innerHeight/2:y;const now=performance.now();flashA=.92;
 for(let i=0;i<4;i++)rings.push({x,y,born:now+i*140,life:1100,max:Math.hypot(innerWidth,innerHeight)*.7,w:9-i});
 const m=Math.hypot(innerWidth,innerHeight)*.6;for(let i=0;i<10;i++)addBolt(x,y,(i/10)*6.283+Math.random()*.4,m*(.6+Math.random()*.4),0);
 /* two long bolts from the top of the screen */
 addBolt(innerWidth*.3,0,1.45,innerHeight*.95,0);addBolt(innerWidth*.72,0,1.7,innerHeight*.9,0);
 addConfetti(x,y,150,true);fxStart(3400);
}
window.addEventListener('resize',()=>{if(raf)fit()});

/* ---------- Code 39 barcode (letters, digits and dash) ---------- */
const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','*':'nwnnwnwnn'};
function code39(text){
 const s='*'+String(text).toUpperCase().replace(/[^0-9A-Z-]/g,'')+'*';let x=0,r='';
 for(const ch of s){const p=C39[ch];if(!p)continue;for(let i=0;i<9;i++){const w=p[i]==='w'?2.5:1;if(i%2===0)r+=`<rect x="${x}" y="0" width="${w}" height="40" fill="#000"/>`;x+=w}x+=1}
 return `<svg class="bars" viewBox="0 0 ${x} 40" preserveAspectRatio="none" role="img" aria-label="Barcode ${esc(text)}">${r}</svg>`;
}

let heroT=null;
function startHero(){
 clearInterval(heroT);const hs=$('hs');if(!hs)return;const n=hs.children.length,sec=+S.settings.slideSec||0;let pause=0;
 const upd=()=>{const i=Math.round(hs.scrollLeft/Math.max(1,hs.clientWidth));document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i))};
 hs.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});
 ['pointerdown','touchstart','wheel'].forEach(ev=>hs.addEventListener(ev,()=>{pause=Date.now()+8000},{passive:true}));
 if(sec>0&&n>1&&!rm)heroT=setInterval(()=>{
  if(!document.body.contains(hs)){clearInterval(heroT);return}

  const i=Math.round(hs.scrollLeft/hs.clientWidth);hs.scrollTo({left:((i+1)%n)*hs.clientWidth,behavior:'smooth'});

/* ---------- maps helpers ---------- */
function parseLink(l){
 const m=String(l||'').match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||String(l).match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/)||String(l).match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
 return m?{lat:+m[1],lng:+m[2]}:null;
}
function mapsUrl(a){
 if(a.lat!=null)return 'https://www.google.com/maps/search/?api=1&query='+a.lat+','+a.lng;
 if(a.link)return a.link;
 return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.txt||'');
}
function navUrl(a){
 if(a.lat!=null)return 'https://www.google.com/maps/dir/?api=1&destination='+a.lat+','+a.lng+'&travelmode=two-wheeler';
 if(a.link)return a.link;
 return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a.txt||'')+'&travelmode=two-wheeler';
}

function resetSlide(){
 SL.drag=false;SL.placed=false;const k=$('knob');if(!k)return;
 k.style.transition='transform .25s';$('sFill').style.transition='width .25s';setX(0);
 setTimeout(()=>{const kk=$('knob'),f=$('sFill');if(kk)kk.style.transition='';if(f)f.style.transition=''},280);
}
document.addEventListener('pointerdown',e=>{
 const k=e.target.closest&&e.target.closest('#knob');if(!k||SL.placed)return;
 if(k.closest('.slide').classList.contains('locked')){const c=calc();toast(!S.settings.open?'The store is closed right now':'Minimum order is '+inr(c.min)+'. Add '+inr(c.need)+' more to place your order.',true);shakeEl($('slide'));return}
 if(!validateCk())return;
 SL.drag=true;SL.sx=e.clientX-SL.x;try{k.setPointerCapture(e.pointerId)}catch(x){}
 k.style.transition='none';$('sFill').style.transition='none';k.classList.add('drag');ac();
});
document.addEventListener('pointermove',e=>{if(SL.drag)setX(Math.max(0,Math.min(slMax(),e.clientX-SL.sx)))});
function endDrag(){if(!SL.drag)return;SL.drag=false;const k=$('knob');if(k)k.classList.remove('drag');if(SL.x>=slMax()*.9)finishOrder();else resetSlide()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{
 if(!(e.target&&e.target.id==='knob')||SL.placed)return;
 if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();if($('slide').classList.contains('locked')){toast('Add more items to reach the minimum order',true);return}if(!validateCk())return;setX(Math.min(slMax(),SL.x+slMax()*.4));if(SL.x>=slMax()*.9)finishOrder()}
});

   handler:resp=>done(resp.razorpay_payment_id||'paid'),modal:{ondismiss:fail}});

 if(c.width!==Math.floor(w*d)){c.width=Math.floor(w*d);c.height=Math.floor(h*d)}

 g.clearRect(0,0,w,h);g.fillStyle=V('--s1');g.fillRect(0,0,w,h);

 [[.1,.05,.1,.95],[.46,.05,.46,.95],[.86,.05,.86,.95],[.02,.32,.98,.32],[.02,.66,.98,.66],[.02,.9,.98,.9],[.02,.12,.98,.12]].forEach(l=>{g.beginPath();g.moveTo(l[0]*w,l[1]*h);g.lineTo(l[2]*w,l[3]*h);g.stroke()});
 g.lineWidth=3;g.globalAlpha=.6;[[.28,.05,.28,.95],[.66,.05,.66,.95]].forEach(l=>{g.beginPath();g.moveTo(l[0]*w,l[1]*h);g.lineTo(l[2]*w,l[3]*h);g.stroke()});g.globalAlpha=1;
 const pts=ROUTE.map(p=>[p[0]*w,p[1]*h]),lens=[];let tot=0;

function riderCard(o,go){
 const a=o.addr||{},tel='91'+o.phone,since=o.stageTs[o.stage]||o.ts;
 return `<div class="card ord"><div class="h"><b class="d">${esc(o.id)}</b><span class="tag s${o.stage}">${go?'OUT FOR DELIVERY':'READY AT STORE'}</span><span class="grow"></span><span class="tn" style="font-weight:800;color:var(--wrn)" data-since="${since}"></span></div>
 <div class="kv"><span>Customer</span><b>${esc(o.name)}</b><span>Address</span><b>${esc(a.txt)}</b><span>Collect</span><b class="tn">${o.pay==='online'?'Already paid online':inr(o.total)+' (cash / UPI)'}</b><span>Items</span><b>${o.items.reduce((s,i)=>s+i.qty,0)}</b></div>
 <div class="acts"><a class="btn pri" href="${esc(navUrl(a))}" target="_blank" rel="noopener">${ico('nav',15)} Navigate in Google Maps</a><a class="btn" href="tel:+${tel}">${ico('phone',15)} Call customer</a></div>
 ${go?`<div class="row" style="align-items:flex-end"><div class="field grow"><label for="otp-${o.id}">Customer OTP</label><input id="otp-${o.id}" type="tel" inputmode="numeric" maxlength="4" placeholder="4-digit code"></div><button class="btn pri" data-act="rider-deliver" data-oid="${o.id}">${ico('check',15)} Verify OTP</button></div>`:'<div class="hint">The shop will hand this order over to you from the Admin panel.</div>'}</div>`;
}
function renderRider(){
 const ready=S.orders.filter(o=>o.stage===1),going=S.orders.filter(o=>o.stage===2),done=S.orders.filter(o=>o.stage===3&&new Date(o.ts).toDateString()===new Date().toDateString());
 const cash=done.filter(o=>o.pay==='cod').reduce((s,o)=>s+o.total,0),earn=done.length*(+S.settings.riderRate||0),on=S.settings.riderOnline!==false;
 $('v-rider').innerHTML=`<div class="col" style="padding-block:12px 20px"><div class="card" style="padding:14px;display:flex;gap:12px;align-items:center"><span class="logo" style="width:46px;height:46px">${ico('bike',24)}</span><div class="grow"><h2 class="d" style="font-size:18px">${esc(S.settings.riderName)}</h2><span class="online${on?'':' off'}">${on?'Online':'Offline'}</span></div><button class="sw" role="switch" aria-checked="${on}" data-act="rider-online" aria-label="Rider online"></button></div>
 <div class="stats"><div class="card stat"><small>Today's deliveries</small><b class="tn">${done.length}</b></div><div class="card stat"><small>Earnings</small><b class="tn">${inr(earn)}</b></div><div class="card stat"><small>Cash collected</small><b class="tn">${inr(cash)}</b></div></div>
 <div class="row"><h3 class="d grow" style="font-size:17px">Assigned Orders</h3><span class="hint">${going.length} active</span></div>
 ${going.length?going.map(o=>riderCard(o,true)).join(''):`<div class="card empty">No deliveries on the way. Orders appear here after the shop hands them over.</div>`}
 ${ready.length?`<div class="eyebrow">Ready at store</div>${ready.map(o=>riderCard(o,false)).join('')}`:''}</div>`;
 tickSince();
}
function tickSince(){document.querySelectorAll('[data-since]').forEach(el=>{const sec=Math.max(0,Math.floor((Date.now()-(+el.dataset.since))/1000));el.textContent=Math.floor(sec/60)+'m '+pad2(sec%60)+'s'})}
setInterval(tickSince,1000);
function riderDeliver(oid){
 const o=ord(oid),inp=$('otp-'+oid);if(!o||!inp)return;
 if(inp.value.trim()!==o.otp){inp.classList.add('err');shakeEl(inp.closest('.ord'));toast('Wrong OTP. Ask the customer for the 4-digit code.',true);return}
 advance(oid);
}

function setPanel(p){
 const need=(p==='admin'&&S.settings.adminPin)||(p==='rider'&&S.settings.riderPin);
 if(need&&!U.unlocked[p]){
  openOv('ovGate',`<h3>Enter ${p} PIN</h3><div class="field"><label for="gatePin">PIN</label><input id="gatePin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div><div class="acts"><button class="btn pri" data-act="gate-go" data-p="${p}">Unlock</button><button class="btn" data-act="closeov" data-o="ovGate">Cancel</button></div>`,'mid');
  setTimeout(()=>{const g=$('gatePin');if(g)g.focus()},60);return;

function profEditor(){
 openOv('ovEdit',`<div class="row"><h3 class="grow">Your details</h3><button class="ib" data-act="closeov" data-o="ovEdit" aria-label="Close">${ico('close',18)}</button></div>

function reorder(oid){
 const o=ord(oid);if(!o)return;let n=0;
 o.items.forEach(i=>{const p=prod(i.id);if(!p||p.stock<=0)return;U.cart[p.id]=Math.min(i.qty,p.stock);n++});
 if(!n){toast('These items are not in stock right now',true);return}
 U.prevSub=calc().sub;document.querySelectorAll('[data-ctl]').forEach(el=>refreshCtl(+el.dataset.ctl));renderBar();toast('Items added to your basket');openCart();
}
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,m=$('mic');
 if(!SR){toast('Voice search is not supported here. Type to search.',true);return}
 try{const r=new SR();r.lang='en-IN';m.classList.add('on');
  r.onresult=ev=>{const t=ev.results[0][0].transcript;$('q').value=t;U.q=t;renderStore()};
  r.onerror=()=>{m.classList.remove('on');toast('Microphone is not available here. Type to search.',true)};r.onend=()=>m.classList.remove('on');r.start();
 }catch(e){m.classList.remove('on');toast('Microphone is not available here. Type to search.',true)}
}
document.addEventListener('click',e=>{
 const ovEl=e.target.classList&&e.target.classList.contains('ov')?e.target:null;if(ovEl){closeOv(ovEl.id);return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=+b.dataset.id,oid=b.dataset.oid,d=b.dataset;
 switch(a){
  case 'panel':setPanel(d.p);break;
  case 'tab':U.pages.slice().forEach(closePage);if(d.t==='cats')U.cat='all';setTab(d.t);break;
  case 'theme':toggleTheme();break;
  case 'add':setQty(id,1);break;
  case 'dec':setQty(id,-1);break;
  case 'open':productPage(id);break;
  case 'back':backPage();break;
  case 'cart-open':openCart();break;
  case 'checkout':openCheckout();break;
  case 'remove-line':removeLine(id);break;
  case 'clear-cart':confirmTap('clear',clearCart,'Tap Clear All again to empty your cart');break;
  case 'slot-sheet':openSlotSheet();break;
  case 'slot-pick':S.cust.slot=d.s;save();closeOv('ovSlot');renderLoc();refreshCheckout();break;
  case 'wish':toggleWish(id);break;
  case 'wishlist':openWish();break;
  case 'flash-go':{const f=$('flashRail');if(f)f.scrollIntoView({behavior:rm?'auto':'smooth',block:'center'});break}
  case 'flash-restart':U.flashEnd=Date.now()+(+S.settings.flashHours||3)*3600*1000;toast('Flash sale timer restarted');break;
  case 'flash-add':{const v=+$('fl-add').value;const p=prod(v);if(p){p.flash=true;save();renderAdmin();toast(p.name+' added to flash sale')}break}
  case 'rider-online':S.settings.riderOnline=!(S.settings.riderOnline!==false);save();renderRider();break;
  case 'gocat':U.cat=d.c;setTab('cats');break;
  case 'selcat':U.cat=d.c;renderStore();break;
  case 'banner':{const bn=S.banners.find(x=>x.id===d.i);if(bn&&bn.pid&&prod(bn.pid))productPage(bn.pid);else{U.cat='all';setTab('cats')}break}
  case 'hnav':{const hs=$('hs');if(hs){const n=hs.children.length,i=Math.round(hs.scrollLeft/hs.clientWidth);hs.scrollTo({left:((i+(+d.d)+n)%n)*hs.clientWidth,behavior:'smooth'})}break}
  case 'mic':startVoice();break;
  case 'addr':openAddr();break;
  case 'addr-pick':S.cust.addrId=d.id;save();closeOv('ovAddr');renderLoc();refreshCheckout();break;
  case 'addr-del':S.cust.addrs=S.cust.addrs.filter(x=>x.id!==d.id);if(S.cust.addrId===d.id)S.cust.addrId=S.cust.addrs[0].id;save();$('ovAddr').querySelector('.sheet').innerHTML=addrHTML();renderLoc();refreshCheckout();break;
  case 'atag':U.draftAddr.tag=d.t;document.querySelectorAll('#adTags .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.t===d.t)));break;
  case 'gps':gpsPin();break;
  case 'addr-save':saveAddr();break;
  case 'closeov':closeOv(d.o);break;
  case 'slot':S.cust.slot=d.s;save();renderLoc();refreshCheckout();break;
  case 'pay':S.cust.pay=d.m;save();refreshCheckout();break;
  case 'track':openTrack(oid);break;
  case 'reorder':reorder(oid);break;
  case 'bill':openBill(oid);break;
  case 'paper':{S.settings.paper=d.w==='A4'?'A4':+d.w;save();const o=ord(U.billO||'');const sh=$('ovBill')&&$('ovBill').querySelector('.sheet');const cur=sh&&sh.querySelector('[data-act="print"]');if(cur){sh.innerHTML=billInner(ord(cur.dataset.oid))}break}
  case 'print':printBill(oid);break;
  case 'copybill':{const o=ord(oid);const t=billText(o);const fb=()=>toast('Could not copy. Select the bill text and copy it.',true);try{navigator.clipboard.writeText(t).then(()=>toast('Bill copied'),fb)}catch(x){fb()}break}
  case 'edit-prof':profEditor();break;
  case 'prof-save':{const n=$('pf-name').value.trim(),p=$('pf-phone').value.trim();if(p&&!/^[6-9]\d{9}$/.test(p)){toast('Enter a valid 10-digit mobile number',true);break}S.cust.name=n;S.cust.phone=p;save();closeOv('ovEdit');renderHdr();renderStore();toast('Details saved');break}
  case 'gate-go':{const p=d.p,pin=p==='admin'?S.settings.adminPin:S.settings.riderPin;if($('gatePin').value===pin){U.unlocked[p]=true;closeOv('ovGate');setPanel(p)}else{toast('Wrong PIN',true);shakeEl($('gatePin'))}break}
  /* admin */
  case 'a-tab':U.a.tab=d.k;renderAdmin();window.scrollTo(0,0);break;
  case 'a-of':U.a.of=d.f;renderAdmin();break;
  case 'a-cf':U.a.cf=d.c;renderAdmin();break;
  case 'adv':advance(oid);break;
  case 'toggle-open':S.settings.open=!S.settings.open;save();renderAdmin();toast(S.settings.open?'Store is open for orders':'Store is closed. Customers cannot order.');break;

  case 'prod-del':confirmTap('p'+id,()=>{S.products=S.products.filter(p=>p.id!==id);delete U.cart[id];S.banners.forEach(x=>{if(+x.pid===id)x.pid=0});save();closeOv('ovEdit');renderAdmin();renderBar();toast('Product deleted')},'Tap Delete again to remove this product');break;
  case 'stk':{const p=prod(id);p.stock=Math.max(0,p.stock+(+d.d));save();renderAdmin();break}
  case 'flash':{const p=prod(id);p.flash=!p.flash;save();renderAdmin();break}
  case 'cat-edit':catEditor(d.id);break;
  case 'cat-save':saveCat(d.id);break;

  case 'ban-edit':banEditor(d.id);break;
  case 'ban-save':saveBan(d.id);break;
  case 'ban-del':confirmTap('b'+d.id,()=>{S.banners=S.banners.filter(x=>x.id!==d.id);save();renderAdmin();toast('Banner deleted')},'Tap the bin again to delete this banner');break;
  case 'ban-mv':{const i=+d.i,j=i+(+d.d);if(j<0||j>=S.banners.length)break;[S.banners[i],S.banners[j]]=[S.banners[j],S.banners[i]];save();renderAdmin();break}
  case 'ban-on':{const x=S.banners[+d.i];x.on=x.on===false;save();renderAdmin();break}
  case 'pick':$(d.t).click();break;

});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){const ovs=document.querySelectorAll('.ov');if(ovs.length)closeOv(ovs[ovs.length-1].id);else if(U.page)backPage()}
 if(e.key==='Enter'&&e.target.matches&&e.target.matches('.pc[data-act="open"]'))e.target.click();
});
window.addEventListener('hashchange',()=>{if(window.DS_MODE)return;const h=location.hash.replace('#','');if(h==='admin'||h==='rider')setPanel(h);else if(h==='store'||h==='')setPanel('store')});
window.addEventListener('storage',e=>{
 if(e.key!==KEY)return;const before=S.orders.length;S=load();
 if(S.orders.length>before&&U.panel==='admin')sndBell();
 if(!U.pages.includes('pgCheckout')&&!document.querySelector('.ov')){renderAll()}else{renderStrip();renderNav()}
 if($('pgTrack'))renderTrack();
});

/* ================= INIT ================= */
applyTheme();
{const m=window.DS_MODE;
 if(m==='admin'||m==='rider'){U.panel='store';document.body.dataset.mode=m;renderAll();setPanel(m)}
 else if(m==='store'){document.body.dataset.mode='store';renderAll()}
 else{renderAll();const h=location.hash.replace('#','');if(h==='admin'||h==='rider')setPanel(h)}
}


})();
</script>
