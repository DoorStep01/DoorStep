<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Partner App | DoorStep by New Janta Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #070d0d; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(15, 23, 23, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(13, 242, 166, 0.18); }
    .cyan-btn { background: linear-gradient(135deg, #0df2a6, #08b6d4); color: #041010; font-weight: 800; }
  </style>
</head>
<body class="pb-16">

  <!-- RIDER HEADER -->
  <header class="sticky top-0 z-30 bg-[#070d0d]/95 backdrop-blur-md border-b border-teal-950 p-4 shadow-xl">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-teal-500/20 text-teal-300 border border-teal-500/40 flex items-center justify-center text-lg">
          <i class="fa-solid fa-motorcycle"></i>
        </div>
        <div>
          <h1 class="text-base font-black text-white">DoorStep Rider App</h1>
          <p class="text-[11px] text-teal-400 font-semibold">Express Delivery Partner</p>
        </div>
      </div>

      <!-- Select Rider Profile -->
      <select id="riderSelect" onchange="renderRiderTasks()" class="bg-[#121c1c] border border-teal-900/60 text-white rounded-xl px-2.5 py-1.5 text-xs outline-none font-bold">
        <option value="Rahul Kumar">Rahul (Rider 1)</option>
        <option value="Sumit Roy">Sumit (Rider 2)</option>
        <option value="Amit Shaw">Amit (Rider 3)</option>
      </select>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="flex justify-between items-center text-xs font-black text-gray-400">
      <span>Assigned Deliveries</span>
      <span id="activeCount" class="text-teal-400">0 Active</span>
    </div>

    <div id="riderTasks" class="space-y-3">
      <!-- Injected -->
    </div>
  </main>

  <script>
    function renderRiderTasks() {
      const selectedRider = document.getElementById("riderSelect").value;
      const orders = JSON.parse(localStorage.getItem("doorstep_orders") || "[]");
      const list = document.getElementById("riderTasks");
      list.innerHTML = "";

      const myTasks = orders.filter(o => o.status === "ASSIGNED" && (!o.rider || o.rider === selectedRider));
      document.getElementById("activeCount").innerText = `${myTasks.length} Active Tasks`;

      if (myTasks.length === 0) {
        list.innerHTML = `
          <div class="glass-card p-8 rounded-2xl text-center text-gray-500 font-bold text-xs space-y-2">
            <i class="fa-solid fa-mug-hot text-2xl text-teal-400"></i>
            <p>No active deliveries assigned to you right now.</p>
            <p class="text-[11px] text-gray-600">Waiting for New Janta Store dispatcher...</p>
          </div>
        `;
        return;
      }

      myTasks.forEach(o => {
        const div = document.createElement("div");
        div.className = "glass-card rounded-2xl p-4 space-y-3 border border-teal-500/25";

        const itemsStr = o.items.map(i => `${i.name} (${i.unit}) x ${i.qty}`).join(", ");

        const mapBtn = o.customer.gps
          ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${o.customer.gps}" target="_blank" class="w-full bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/40 font-bold text-xs py-2.5 rounded-xl flex items-center justify-center gap-1.5"><i class="fa-solid fa-location-arrow"></i> Open Turn-by-Turn GPS Map</a>`
          : `<div class="text-[11px] text-gray-500 p-2 rounded-lg bg-black/40 text-center">No GPS coordinates available. Navigate to street address.</div>`;

        div.innerHTML = `
          <div class="flex justify-between items-center border-b border-teal-950 pb-2">
            <span class="text-sm font-black text-white">#${o.orderId}</span>
            <span class="text-xs font-black px-2.5 py-0.5 rounded-full ${o.payStatus.includes('PAID') ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-amber-950 text-amber-300 border border-amber-800'}">
              ${o.payStatus.includes('PAID') ? 'Online Paid ✓' : `Collect Cash: ₹${o.total}`}
            </span>
          </div>

          <div class="space-y-1.5 text-xs">
            <p class="font-bold text-gray-200">👤 Customer: <span class="text-white">${o.customer.name}</span></p>
            <p class="text-gray-400">📍 Address: <span class="text-gray-200">${o.customer.address}</span></p>
            <p class="text-gray-400">📦 Items: <span class="text-teal-300">${itemsStr}</span></p>
          </div>

          ${mapBtn}

          <div class="grid grid-cols-2 gap-2 pt-1">
            <a href="tel:${o.customer.phone}" class="bg-gray-900 hover:bg-gray-800 text-teal-300 border border-teal-900 font-bold text-xs py-2.5 rounded-xl flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-phone"></i> Call Customer
            </a>
            <button onclick="markDelivered('${o.orderId}')" class="cyan-btn text-xs font-black py-2.5 rounded-xl flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-check"></i> Delivered
            </button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function markDelivered(orderId) {
      if (confirm("Confirm that items have been delivered and payment received?")) {
        const orders = JSON.parse(localStorage.getItem("doorstep_orders") || "[]");
        const target = orders.find(o => o.orderId === orderId);
        if (target) {
          target.status = "DELIVERED";
          if (!target.payStatus.includes("PAID")) target.payStatus = "COD Collected ✓";
          localStorage.setItem("doorstep_orders", JSON.stringify(orders));
          window.dispatchEvent(new Event('storage'));
          renderRiderTasks();
        }
      }
    }

    window.addEventListener('storage', () => { renderRiderTasks(); });
    renderRiderTasks();
  </script>
</body>
</html>
